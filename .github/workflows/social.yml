name: social (X・Instagramへの自動投稿)

# サイトの公開が終わるたびに動く。
# 1. 公開済みの画像があれば X・Instagram に投稿（鍵が未設定なら下書きのまま）
# 2. 新しく条件を満たした投稿（的中・重賞・毎晩の全成績）の画像と文面を作って push し、サイトを再公開（→ 次の回で投稿）
on:
  workflow_run:
    workflows: ["pages (サイトの生成と公開)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      date:
        description: "対象日 YYYYMMDD（空なら今日）"
        required: false
      only:
        description: "この投稿IDだけ出す（手動テスト用）"
        required: false
      chained:
        description: "内部用：再公開後の連鎖起動なら 1（さらに連鎖しない）"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: social
  cancel-in-progress: false

jobs:
  social:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 投稿と準備
        id: s
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          META_BUSINESS_ID: "1775467983753893"
        run: |
          D="${{ inputs.date }}"; O="${{ inputs.only }}"
          if [ -n "$D" ]; then DATES="$D"; else DATES="$(TZ=Asia/Tokyo date +%Y%m%d) $(TZ=Asia/Tokyo date -d tomorrow +%Y%m%d)"; fi
          P=0
          for X in $DATES; do  # 明日の分は前日夜の重賞予想だけが対象になる
            OUT=$(python scraper/social.py --date "$X" ${O:+--only "$O"} | tail -1); echo "$X $OUT"
            P=$((P + $(echo "$OUT" | python -c 'import sys,json;print(json.load(sys.stdin)["prepared"])')))
          done
          echo "prepared=$P" >> "$GITHUB_OUTPUT"
      - name: 保存
        run: |
          git config user.name "keiba-ai-bot"
          git config user.email "keiba-ai-bot@users.noreply.github.com"
          git add social
          git commit -m "social $(TZ=Asia/Tokyo date +%m%d-%H%M)" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
      - name: 新しい画像があればサイトを再公開（次の回で投稿する）
        if: steps.s.outputs.prepared != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        # GITHUB_TOKEN で起動した pages の完了は workflow_run を発火しない（GitHub の仕様）ので、
        # 「次の回」が自然には来ない。pages の完了を待ってから自分を手動起動する（chained=1 で連鎖は1回まで）。
        run: |
          gh workflow run pages.yml -R "$R"
          sleep 20
          ID=$(gh run list -R "$R" --workflow pages.yml --event workflow_dispatch --limit 1 --json databaseId -q '.[0].databaseId')
          [ -n "$ID" ] && gh run watch "$ID" -R "$R" --exit-status || echo "pages run not found or failed"
          D="${{ inputs.date }}"
          if [ "${{ inputs.chained }}" != "1" ]; then
            gh workflow run social.yml -R "$R" -f chained=1 ${D:+-f date=$D}
          fi
