name: pages (サイトの生成と公開)

on:
  push:
    branches: [main]
    paths: ["predictions/**", "data/results/**", "results_ledger.csv", "site/**", "columns/**"]
  workflow_run:
    workflows: ["daily (毎日の自動取得)"]
    types: [completed]
  schedule:
    - cron: "3 15 * * *"   # JST 0:03：日付が変わったら「今日」を切り替える（GitHubの定時起動は遅れることがある）
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url || steps.d2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow requests
      # 回収率の計算の検算（採点の決まりが崩れていたら公開しない。記録との照合のずれは警告だけ出す）
      - run: python tests/test_scoring.py
      # 画像の作り置き（レースごとの共有画像など）。その日の最初の公開で保存し、以後の公開はそれを使う
      - id: day
        run: echo "d=$(TZ=Asia/Tokyo date +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .imgcache
          key: imgcache-${{ steps.day.outputs.d }}
          restore-keys: imgcache-
      - run: python site/build.py
        env:
          ASK_URL: ${{ vars.ASK_URL }}
          # 「AI vs あなた」月間ランキングのAPI。repository variable LEAGUE_URL があればそちらを使う（"off" と入れると機能ごと止まる）
          LEAGUE_URL: ${{ vars.LEAGUE_URL == 'off' && '' || vars.LEAGUE_URL || 'https://keiba-league.bunbunbunzai.workers.dev' }}
          VS_PUBLIC: ${{ vars.VS_PUBLIC || '1' }}  # 月間ランキングを一般公開（repository variable で 0 にすると合言葉つきに戻る）
          LEAGUE_OWNERS: ${{ vars.LEAGUE_OWNERS }}
      # 検索エンジン（Bing など）に知らせるページの一覧を作る：前回までに知らせた状態（.indexnow/sent.json。cache で引き継ぐ）と比べて、
      # 新しいページ・中身が変わったページだけ。状態を進めるのは、公開と送信が済んだあと（下の2つの手順）。
      # 新しい公開に追い越されて取り消された回は状態が進まないので、次の回がまとめて送る。失敗しても公開は止めない
      - name: 前回までに知らせた内容を読む（IndexNow）
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: .indexnow
          key: indexnow-sent-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: indexnow-sent-
      - name: 更新を知らせるページの一覧を作る（IndexNow）
        continue-on-error: true
        run: python site/indexnow.py diff
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # 公開は GitHub 側の一時的なエラー（「Fetching artifact metadata failed」など）で失敗することがある。
      # そのときは少し待って1回だけやり直す（2回とも失敗したらこの実行は失敗になる）
      - id: d
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: 公開のやり直しを待つ
        if: steps.d.outcome == 'failure'
        run: sleep 45
      - id: d2
        if: steps.d.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: 検索エンジンに更新を通知（IndexNow）
        id: inow
        if: success()
        continue-on-error: true
        run: python site/indexnow.py send
      - name: 知らせた内容を保存（IndexNow）
        if: success() && steps.inow.outputs.saved == '1'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .indexnow
          key: indexnow-sent-${{ github.run_id }}-${{ github.run_attempt }}
