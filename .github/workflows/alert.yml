name: alert (自動処理が失敗したら知らせる)

# 毎日の取得・結果の集計・サイトの公開・SNS投稿・重賞データのどれかが失敗で終わったら、
# 「自動処理の失敗」という Issue に記録する（GitHub からメールで通知が届く。同じ Issue に追記していく）。
# 取り消し（次の実行に追い越された公開など）は失敗に数えない。
on:
  workflow_run:
    workflows: ["daily (毎日の自動取得)", "live (レースごとの結果・回収率の即時集計)", "pages (サイトの生成と公開)", "social (X・Instagramへの自動投稿)", "graded (重賞の過去成績を集めてデータ記事を作る)", "size (サイトの大きさの見張り)"]
    types: [completed]

permissions:
  issues: write
  contents: read

jobs:
  alert:
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out' }}
    runs-on: ubuntu-latest
    steps:
      - name: Issue に記録
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NAME: ${{ github.event.workflow_run.name }}
          URL: ${{ github.event.workflow_run.html_url }}
          RESULT: ${{ github.event.workflow_run.conclusion }}
        run: |
          when=$(TZ=Asia/Tokyo date "+%m/%d %H:%M")
          body="$when　$NAME が失敗しました（$RESULT）。 $URL"
          n=$(gh issue list -R "$REPO" --state open --search "自動処理の失敗 in:title" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then gh issue comment "$n" -R "$REPO" --body "$body"; else gh issue create -R "$REPO" --title "自動処理の失敗" --body "$body"; fi
