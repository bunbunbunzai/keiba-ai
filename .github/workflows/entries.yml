name: entries (G1の出走予定馬)

# 毎日1回：10日以内に行われるJRAのG1について、JRAの「GⅠ競走プレレーティング」（レース週の月曜11時ごろ発表）から
# 出走予定馬を取り、data/entries に保存する。変わったときだけ保存してサイトを作り直す。AIは呼ばない。
on:
  schedule:
    - cron: "17 3 * * *"   # JST 12:17（月曜11時の発表のあと）
  workflow_dispatch:
    inputs:
      days:
        description: "何日先までのG1を見るか"
        required: false
        default: "10"
      slug:
        description: "このレースだけ（例：mile-championship。確認用）"
        required: false
        default: ""
      date:
        description: "slug と一緒に：開催日 YYYYMMDD（日程に無いとき）"
        required: false
        default: ""
      probe:
        description: "取ったページも data/raw に残す（読み取りの確認用）"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: entries
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: 取得
        working-directory: scraper
        env:
          DAYS: ${{ inputs.days || '10' }}
          SLUG: ${{ inputs.slug }}
          DATE: ${{ inputs.date }}
          PROBE: ${{ inputs.probe && '--probe' || '' }}
        run: python -u jra_entries.py --days "$DAYS" ${SLUG:+--slug "$SLUG"} ${DATE:+--date "$DATE"} $PROBE
      - name: 保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for d in data/entries data/raw; do [ -e "$d" ] && git add "$d"; done
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -q -m "entries: G1の出走予定馬を更新"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep 7; done
          gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
