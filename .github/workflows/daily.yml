name: daily (毎日の自動取得)

# 時刻はUTC。日本時間 = UTC+9
on:
  # GitHub の schedule は混雑時に数時間遅れたり、落ちたりする（毎時0分・30分は特に混む）。
  # そのため分をずらし、各フェーズに予備の時刻を1つずつ置く。
  # 予備は「本番が成功済み（data/runs/<日付>/<phase>-<source>.done がある）」なら何もしない。
  # 本番は Claude の定期タスクが workflow_dispatch で起動する。
  # 下の schedule は予備：Claude側の起動が失敗した日（使用量上限など）だけ動く。本番が成功済みなら何もしない。
  schedule:
    - cron: "47 1 * * *"   # 10:47 昼（noon）の予備
    - cron: "7 7 * * *"    # 16:07 午後（mid）の予備
    - cron: "41 9 * * *"   # 18:41 夕方（eve）の予備
    - cron: "17 13 * * *"  # 22:17 夜（night）の予備
  workflow_dispatch:
    inputs:
      phase:
        description: "eve / noon / mid / night"
        required: true
      date:
        description: "対象日 YYYYMMDD（空なら自動）"
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      phase: ${{ steps.p.outputs.phase }}
      date: ${{ steps.p.outputs.date }}
    steps:
      - id: p
        run: |
          PHASE="${{ inputs.phase }}"
          if [ -z "$PHASE" ]; then
            case "${{ github.event.schedule }}" in
              "7 8 * * *"|"41 9 * * *") PHASE=eve ;;
              "13 1 * * *"|"47 1 * * *") PHASE=noon ;;
              "7 7 * * *") PHASE=mid ;;
              *) PHASE=night ;;
            esac
          fi
          D="${{ inputs.date }}"
          if [ -z "$D" ]; then
            if [ "$PHASE" = eve ]; then D=$(TZ=Asia/Tokyo date -d tomorrow +%Y%m%d); else D=$(TZ=Asia/Tokyo date +%Y%m%d); fi
          fi
          echo "phase=$PHASE" >> "$GITHUB_OUTPUT"; echo "date=$D" >> "$GITHUB_OUTPUT"

  fetch:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        source: [jra, rakuten]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 実行済みか確認
        id: chk
        env:
          PHASE: ${{ needs.plan.outputs.phase }}
          D: ${{ needs.plan.outputs.date }}
          SRC: ${{ matrix.source }}
        run: |
          M="data/runs/$D/$PHASE-$SRC.done"
          git fetch -q origin main
          if [ "${{ github.event_name }}" = schedule ] && git cat-file -e "origin/main:$M" 2>/dev/null; then
            echo "already done: $M"; echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi
      - name: 取得
        id: get
        if: steps.chk.outputs.skip == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          PHASE: ${{ needs.plan.outputs.phase }}
          D: ${{ needs.plan.outputs.date }}
          SRC: ${{ matrix.source }}
        run: |
          git config user.name "keiba-ai-bot"
          git config user.email "keiba-ai-bot@users.noreply.github.com"
          cd scraper
          IL=--interleave-results
          case "$PHASE-$SRC" in
            eve-jra)      python jra_cards.py --date "$D" ;;
            noon-jra)     python jra_cards.py --date "$D" --past 0 && python results.py --date "$D" --source jra; python bias.py --date "$D" --source "$SRC" ;;
            mid-jra)      python jra_cards.py --date "$D" --past 0 && python results.py --date "$D" --source jra; python bias.py --date "$D" --source "$SRC" ;;
            eve-rakuten)  python rakuten.py --date "$D" --kinds card $IL && python parse_rakuten.py --date "$D" ;;
            noon-rakuten) python rakuten.py --date "$D" --kinds card --after-now $IL && python parse_rakuten.py --date "$D" ;;
            mid-rakuten)  python results.py --date "$D" --source rakuten --finished-only; python bias.py --date "$D" --source "$SRC"; python rakuten.py --date "$D" --kinds card --after-now $IL && python parse_rakuten.py --date "$D" ;;
            night-*)      python results.py --date "$D" --source "$SRC"; python bias.py --date "$D" --source "$SRC" ;;
          esac
        continue-on-error: true
      - name: 保存
        if: steps.chk.outputs.skip == '0'
        env:
          PHASE: ${{ needs.plan.outputs.phase }}
          D: ${{ needs.plan.outputs.date }}
          SRC: ${{ matrix.source }}
        run: |
          if [ "${{ steps.get.outcome }}" = success ]; then
            mkdir -p "data/runs/$D"; date -u +%FT%TZ > "data/runs/$D/$PHASE-$SRC.done"
          fi
          git config user.name "keiba-ai-bot"
          git config user.email "keiba-ai-bot@users.noreply.github.com"
          git add data
          git commit -m "$PHASE $SRC $D" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
      - name: 取得の失敗を表示
        if: steps.get.outcome == 'failure'
        run: |
          echo "::error::取得スクリプトが失敗した（途中までのデータは保存済み）"
          exit 1

  score:
    needs: [plan, fetch]
    if: ${{ !cancelled() && needs.plan.outputs.phase == 'night' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: cd scraper && python score.py --date ${{ needs.plan.outputs.date }}
      - name: 保存
        run: |
          git config user.name "keiba-ai-bot"
          git config user.email "keiba-ai-bot@users.noreply.github.com"
          git add -A data results_ledger.csv
          git commit -m "score ${{ needs.plan.outputs.date }}" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done

  live:
    # 昼・午後の取得が終わったら、レースごとの即時集計（live.yml）を起動する
    needs: [plan, fetch]
    if: ${{ !cancelled() && (needs.plan.outputs.phase == 'noon' || needs.plan.outputs.phase == 'mid') }}
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 予備の回で、すでにライブ集計が動いていれば起動し直さない（動いている分を止めないため）
          if [ "${{ github.event_name }}" = schedule ] && [ -n "$(gh run list -R "${{ github.repository }}" --workflow live.yml --status in_progress --json databaseId -q '.[].databaseId')" ]; then
            echo "live already running"; exit 0
          fi
          gh workflow run live.yml -R "${{ github.repository }}" -f date=${{ needs.plan.outputs.date }} -f until=21:25
