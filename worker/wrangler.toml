name = "keiba-ask"
main = "src/index.js"
compatibility_date = "2025-10-01"

# 回数制限のカウンタ（Durable Object・SQLite）。KVより書き込み上限が緩い
[[durable_objects.bindings]]
name = "LIMITS"
class_name = "Limits"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Limits"]

[vars]
SITE_ORIGIN = "https://www.ai-keiba-log.com"
MODEL = "claude-haiku-5-5"
# 制限（1日あたり）。費用の上限はこれで決まる：1回あたり約0.3〜1円
LIMIT_IP_DAY = "30"
LIMIT_IP_MIN = "5"
LIMIT_SITE_DAY = "600"
MAX_Q_CHARS = "200"
# 質問に渡すデータの形を変えたら上げる（Workers側のキャッシュを捨てる）
DATA_VER = "2"
# 全頭くんがWeb検索を使える回数（サイト全体・1日）。1回あたり数円
LIMIT_SEARCH_DAY = "20"
# 期間限定の格上げ（この日まで）
BOOST_UNTIL = "2026-11-12"
MODEL_BOOST = "claude-sonnet-5-5"
LIMIT_SEARCH_DAY_BOOST = "100"
